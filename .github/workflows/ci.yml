name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end + accessibility
        run: npx playwright test
      - name: Lighthouse (mobile, simulated 4G)
        run: npx --yes @lhci/cli@0.15.1 autorun
